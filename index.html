<style>
:root{color-scheme:dark}
html,body{height:100%;margin:0;background:#111111;color:#FFFFFF}
body{overflow:hidden;font-family:'Archivo','Helvetica Neue',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
a{color:inherit}
[hidden]{display:none!important}
#app{height:100%;display:flex;justify-content:center;background:#111111}
.scr{position:relative;width:100%;max-width:440px;height:100%;overflow:hidden}
.scr > div{width:100%!important;height:100%!important;max-width:100%}
.scr button{-webkit-appearance:none;appearance:none}
.scr :focus-visible{outline:3px solid #F5B83D;outline-offset:2px}
#pill{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:40;padding:8px 14px;border-radius:999px;background:#111111;color:#FFFFFF;font-size:13px;font-weight:900;font-stretch:110%;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;box-shadow:0 6px 20px -8px rgba(0,0,0,.7)}
#tk{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#111111}
#tk header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
#tk h2{margin:0;font-size:14px;font-weight:900;font-stretch:110%;text-transform:uppercase;letter-spacing:.04em}
#tk button{min-width:44px;min-height:44px;border:0;border-radius:50%;background:#262626;color:#FFFFFF;font:inherit;font-size:22px;font-weight:900;cursor:pointer}
#tk .pg{flex:1;overflow:auto;padding:0 12px 16px;-webkit-overflow-scrolling:touch}
*{touch-action:manipulation}
#tk .pg{touch-action:pan-x pan-y}
#tk-box{position:relative;width:100%;transition:width 260ms cubic-bezier(.32,.72,0,1)}
#tk .pg.zoom #tk-box{width:240%}
#tk-qr{position:absolute;left:75.69%;top:41.05%;width:7.43%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
#tk .hint{margin:10px 0 0;color:#BDBDBD;font-size:12px;font-weight:800;text-align:center;text-transform:uppercase;letter-spacing:.04em}
#qc{position:fixed;z-index:45;top:10px;right:max(12px,calc((100vw - 440px) / 2 + 12px));display:flex;align-items:center;justify-content:center;width:46px;height:46px;border:2px solid #FFFFFF;border-radius:50%;background:#111111;color:#FFFFFF;cursor:pointer;box-shadow:0 6px 18px -8px rgba(0,0,0,.8)}
#qc:active{transform:scale(.92)}
#hb{position:fixed;z-index:45;top:10px;right:max(66px,calc((100vw - 440px) / 2 + 66px));display:flex;align-items:center;justify-content:center;width:46px;height:46px;border:2px solid #FFFFFF;border-radius:50%;background:#111111;color:#FFFFFF;cursor:pointer;box-shadow:0 6px 18px -8px rgba(0,0,0,.8)}
#hb:active{transform:scale(.92)}
#hb[hidden],#hs[hidden],#qc[hidden]{display:none!important}
#hb.pop svg{animation:hb-pop 520ms cubic-bezier(.3,1.6,.5,1)}
@keyframes hb-pop{0%{transform:scale(1)}40%{transform:scale(.7) rotate(-8deg)}100%{transform:scale(1)}}
#hs{position:fixed;inset:0;z-index:55}
#hs .bd{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity 360ms ease}
#hs .sh{position:absolute;left:50%;bottom:0;width:100%;max-width:440px;box-sizing:border-box;max-height:92%;overflow-y:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;background:#111111;color:#FFFFFF;transform:translate(-50%,100%);transition:transform 560ms cubic-bezier(.32,.72,0,1);padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 60px -20px rgba(0,0,0,.8)}
#hs.open .bd{opacity:1}
#hs.open .sh{transform:translate(-50%,0)}
#hs.drag .sh{transition:none}
#hs .grab{width:44px;height:5px;margin:0 auto 12px;border-radius:3px;background:#3A3A3A}
#hs .ph{position:relative;height:168px;margin:0 -16px;overflow:hidden;background:#222}
#hs .ph img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.14);transition:transform 1100ms cubic-bezier(.2,.8,.2,1)}
#hs.open .ph img{transform:scale(1)}
#hs .ph .ko{position:absolute;left:14px;bottom:-18px;font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:84px;line-height:1;letter-spacing:-.04em;color:var(--hc)}
#hs .st{opacity:0;transform:translateY(18px);transition:opacity 420ms ease,transform 620ms cubic-bezier(.32,.72,0,1)}
#hs.open .st{opacity:1;transform:none}
#hs.open .st:nth-child(3){transition-delay:90ms}#hs.open .st:nth-child(4){transition-delay:150ms}#hs.open .st:nth-child(5){transition-delay:210ms}#hs.open .st:nth-child(6){transition-delay:270ms}#hs.open .st:nth-child(7){transition-delay:330ms}
#hs .eb{margin:26px 0 2px;font-size:13px;font-weight:900;font-stretch:125%;text-transform:uppercase;letter-spacing:.03em;color:var(--hc)}
#hs h2{margin:0;font-size:34px;line-height:.95;font-weight:900;font-stretch:125%;letter-spacing:-.02em;text-transform:uppercase}
#hs .kn{margin:6px 0 0;font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:17px;color:#BDBDBD}
#hs .go{display:flex;align-items:center;justify-content:space-between;gap:10px;height:62px;margin-top:18px;padding:0 18px;border-radius:6px;background:var(--hc);color:#111111;font-size:18px;font-weight:900;font-stretch:125%;text-transform:uppercase;text-decoration:none}
#hs .go:active,#hs .row a:active,#hs .cp:active{transform:scale(.97)}
#hs .go svg{transition:transform 300ms cubic-bezier(.3,1.6,.5,1)}
#hs .go:active svg{transform:translateX(6px)}
#hs .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:8px}
#hs .row a{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border:2px solid #3A3A3A;border-radius:6px;color:#FFFFFF;font-size:14px;font-weight:900;font-stretch:110%;text-transform:uppercase;text-decoration:none}
#hs .tx{margin-top:14px;padding:16px;border-radius:6px;background:#FFFFFF;color:#111111}
#hs .tx .lb{font-size:12px;font-weight:900;font-stretch:125%;text-transform:uppercase;letter-spacing:.03em}
#hs .tx .ad{margin:6px 0 4px;font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:26px;line-height:1.2}
#hs .tx .pl{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:16px}
#hs .cp{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;margin-top:12px;border:0;border-radius:6px;background:#111111;color:#FFFFFF;font:inherit;font-size:14px;font-weight:900;text-transform:uppercase;cursor:pointer;transition:background-color 200ms ease}
#hs .cp.ok{background:var(--hc);color:#111111}
#lock{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;background:#F2729F;color:#111111}
#lock form{position:relative;width:100%;max-width:440px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:24px 20px 40px;overflow:hidden}
#lock .ko{position:absolute;top:-40px;right:-60px;font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:300px;line-height:1;letter-spacing:-.04em;color:#111111}
#lock h1{margin:0;font-size:52px;line-height:.9;font-weight:900;font-stretch:125%;letter-spacing:-.02em;text-transform:uppercase}
#lock p{margin:0;font-size:16px;font-weight:700;line-height:1.35}
#lock label{font-size:13px;font-weight:900;font-stretch:125%;text-transform:uppercase}
#lock input{height:56px;box-sizing:border-box;padding:0 16px;border:3px solid #111111;border-radius:4px;background:#FFFFFF;color:#111111;font:inherit;font-size:20px;font-weight:800}
#lock button{height:56px;border:0;border-radius:4px;background:#111111;color:#F2729F;font:inherit;font-size:17px;font-weight:900;font-stretch:125%;text-transform:uppercase;cursor:pointer}
#lock .err{min-height:22px;font-size:15px;font-weight:900}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111111;color:#BDBDBD;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
<style id="screen-css"></style>

<body>
<div id="boot">Abriendo…</div>
<div id="app"></div>
<div id="pill" hidden></div>
<button type="button" id="hb" aria-label="Volver al hotel" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5.5 9.5V20h13V9.5"></path><path d="M10 20v-5h4v5"></path></svg></button>
<div id="hs" hidden role="dialog" aria-modal="true" aria-labelledby="hs-name">
  <div class="bd" id="hs-bd"></div>
  <div class="sh" id="hs-sh">
    <div class="grab" aria-hidden="true"></div>
    <div class="ph"><img id="hs-img" alt=""><span class="ko" id="hs-city" aria-hidden="true"></span></div>
    <p class="eb st" id="hs-eb"></p>
    <div class="st"><h2 id="hs-name"></h2><p class="kn" id="hs-kn" lang="ko"></p></div>
    <a class="go st" id="hs-naver" href="#"><span>Cómo llegar<small style="display:block;margin-top:3px;font-size:11px;font-weight:800;opacity:.7;letter-spacing:.02em">Abre Naver Map</small></span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="square" aria-hidden="true"><path d="M4 12h15"></path><path d="M13 6l6 6-6 6"></path></svg></a>
    <div class="row st"><a id="hs-kakao" href="#" target="_blank" rel="noopener">Kakao Map</a><a id="hs-tel" href="#">Llamar</a></div>
    <div class="tx st"><div class="lb">Para el taxi · enséñale esto</div><div class="ad" id="hs-ad" lang="ko"></div><div class="pl" lang="ko">이 주소로 가 주세요</div><button type="button" class="cp" id="hs-cp">Copiar dirección</button></div>
  </div>
</div>
<button type="button" id="qc" aria-label="Abrir la calculadora de wones" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><rect x="5" y="3" width="14" height="18"></rect><path d="M8 7h8"></path><path d="M8 11.5h.5M11.75 11.5h.5M15.5 11.5h.5M8 15h.5M11.75 15h.5M15.5 15h.5M8 18.5h.5M11.75 18.5h.5M15.5 18.5h.5"></path></svg></button>
<div id="tk" hidden>
  <header><h2 id="tk-t">Billete</h2><button type="button" id="tk-x" aria-label="Cerrar billete">×</button></header>
  <div class="pg" id="tk-pg"><div id="tk-box"><img id="tk-img" alt="Billete del KTX" style="display:block;width:100%;height:auto;border-radius:4px;background:#FFFFFF"><img id="tk-qr" alt="Código QR del billete"></div><p class="hint">Toca el billete para ampliarlo</p></div>
</div>
<div id="lock" hidden>
  <form id="lock-f" autocomplete="off">
    <span class="ko" aria-hidden="true">한국</span>
    <h1>Corea<br>de bolsillo</h1>
    <p>Del 5 al 15 de octubre de 2026</p>
    <label for="pw">Contraseña</label>
    <input id="pw" name="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
    <span class="err" id="pw-err" role="alert"></span>
    <button type="submit" id="pw-go">Entrar</button>
  </form>
</div>
<div id="tpls" hidden></div>

<script>
var BUILD = '202609230733-40fb98d1';
var SALT_B64 = 'UOM3vdOta7X9puIjqspvcQ==';
var ITER = 400000;

(function () {
  var KEY_STORE = 'corea.key.' + SALT_B64.slice(0, 8);
  function b64(buf) { var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  var bundle = null;
  function getBundle() {
    if (bundle) return Promise.resolve(bundle);
    return fetch('app.bin', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('app.bin ' + r.status);
      return r.arrayBuffer();
    }).then(function (buf) { bundle = new Uint8Array(buf); return bundle; });
  }
  function deriveKey(pw) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (base) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(SALT_B64), iterations: ITER, hash: 'SHA-256' }, base, 256);
    });
  }
  function decrypt(raw) {
    return Promise.all([getBundle(), crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])]).then(function (r) {
      var b = r[0], key = r[1];
      var iv = b.slice(0, 12), ct = b.slice(12);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    }).then(function (plain) { return JSON.parse(new TextDecoder().decode(plain)); });
  }

  var lock = document.getElementById('lock'), boot = document.getElementById('boot');
  function askPassword(msg) {
    boot.hidden = true;
    lock.hidden = false;
    document.getElementById('pw-err').textContent = msg || '';
  }
  document.getElementById('lock-f').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    var btn = document.getElementById('pw-go');
    btn.disabled = true; btn.textContent = 'Comprobando…';
    var rawKey;
    deriveKey(pw).then(function (raw) { rawKey = raw; return decrypt(raw); }).then(function (payload) {
      store(KEY_STORE, b64(rawKey));
      lock.hidden = true;
      start(payload);
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = 'Entrar';
      if (err && /app\.bin|Failed to fetch|NetworkError|Load failed/i.test(String(err.message || err))) {
        askPassword('Sin conexión: la primera vez hace falta internet.');
      } else {
        askPassword('Contraseña incorrecta.');
      }
    });
  });

  var saved = load(KEY_STORE);
  if (saved) {
    decrypt(unb64(saved)).then(start).catch(function (err) {
      if (err && /app\.bin|Failed to fetch|NetworkError|Load failed/i.test(String(err.message || err))) {
        boot.textContent = 'Sin conexión y sin copia guardada todavía';
      } else { store(KEY_STORE, null); askPassword('La contraseña ha cambiado. Escríbela de nuevo.'); }
    });
  } else {
    askPassword('');
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  // ---------- motor de pantallas ----------
  function start(payload) {
    document.getElementById('screen-css').textContent = payload.css;
    document.getElementById('tpls').innerHTML = payload.templates;
    var mod = new Function(payload.scripts + '\nreturn { SCRIPTS: SCRIPTS, ASSETS: ASSETS, HOTELS: HOTELS };')();
    var SCRIPTS = mod.SCRIPTS, ASSETS = mod.ASSETS, HOTELS = mod.HOTELS;
    boot.hidden = true;

    var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
    var ONLY = /^\{\{\s*([^}]+?)\s*\}\}$/;
    function lookup(path, scope) {
      if (path === 'true') return true;
      if (path === 'false') return false;
      if (path === 'null') return null;
      if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
      var parts = path.split('.'), v = scope;
      for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
      return v;
    }
    function interp(str, scope) { return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); }); }
    function child(scope, name, val, idx) { var s = Object.create(scope); s[name] = val; s.$index = idx; return s; }
    function render(node, scope, out) {
      if (node.nodeType === 3) { out.push(document.createTextNode(interp(node.data, scope))); return; }
      if (node.nodeType !== 1) return;
      var tag = node.localName;
      if (tag === 'sc-for') {
        var list = lookup(ONLY.exec(node.getAttribute('list'))[1], scope) || [];
        var as = node.getAttribute('as') || 'item';
        for (var i = 0; i < list.length; i++) { var sc = child(scope, as, list[i], i); node.childNodes.forEach(function (c) { render(c, sc, out); }); }
        return;
      }
      if (tag === 'sc-if') {
        if (lookup(ONLY.exec(node.getAttribute('value'))[1], scope)) node.childNodes.forEach(function (c) { render(c, scope, out); });
        return;
      }
      var el = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(node.namespaceURI, tag) : document.createElement(tag);
      for (var a = 0; a < node.attributes.length; a++) {
        var at = node.attributes[a], name = at.name, val = at.value;
        if (name.indexOf('hint-') === 0) continue;
        var m = ONLY.exec(val);
        if (name === 'onclick') { el.__h = m ? lookup(m[1], scope) : null; continue; }
        var v = m ? lookup(m[1], scope) : interp(val, scope);
        if (v == null || v === false) continue;
        v = String(v);
        if (v.indexOf('asset:') === 0) v = ASSETS[v.slice(6)] || '';
        el.setAttribute(name, v);
      }
      if (tag === 'a') {
        var href = el.getAttribute('href') || '';
        if (/^https?:/.test(href)) { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener'); }
      }
      var co = [];
      node.childNodes.forEach(function (c) { render(c, scope, co); });
      co.forEach(function (c) { el.appendChild(c); });
      out.push(el);
    }
    function morph(a, b) {
      if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
      if (a.nodeType === 3) { if (a.data !== b.data) a.data = b.data; return; }
      var i, n;
      for (i = a.attributes.length - 1; i >= 0; i--) { n = a.attributes[i].name; if (!b.hasAttribute(n)) a.removeAttribute(n); }
      for (i = 0; i < b.attributes.length; i++) { n = b.attributes[i]; if (a.getAttribute(n.name) !== n.value) a.setAttribute(n.name, n.value); }
      a.__h = b.__h;
      morphKids(a, b);
    }
    function morphKids(a, b) {
      var ak = Array.prototype.slice.call(a.childNodes), bk = Array.prototype.slice.call(b.childNodes);
      for (var i = 0; i < bk.length; i++) { if (i < ak.length) morph(ak[i], bk[i]); else a.appendChild(bk[i]); }
      for (var j = bk.length; j < ak.length; j++) ak[j].remove();
    }

    function DCLogic(props) { this.props = props || {}; this.state = {}; }
    DCLogic.prototype.setState = function (o) {
      var p = typeof o === 'function' ? o(this.state, this.props) : o;
      this.state = Object.assign({}, this.state, p);
      if (this.__render) this.__render();
    };
    DCLogic.prototype.forceUpdate = function () { if (this.__render) this.__render(); };

    var app = document.getElementById('app'), pill = document.getElementById('pill');
    var screens = {}, current = null;
    function build(name) {
      var tpl = document.getElementById('t-' + name);
      var inst = new (SCRIPTS[name](DCLogic))({});
      var host = document.createElement('div');
      host.className = 'scr'; host.hidden = true;
      app.appendChild(host);
      inst.__render = function () {
        var vals = inst.renderVals ? inst.renderVals() : {};
        var out = [];
        tpl.content.childNodes.forEach(function (c) { render(c, vals, out); });
        var tmp = document.createElement('div');
        out.forEach(function (c) { tmp.appendChild(c); });
        morphKids(host, tmp);
      };
      inst.__render();
      if (inst.componentDidMount) { try { inst.componentDidMount(); } catch (e) {} }
      return (screens[name] = { host: host, inst: inst });
    }

    // Hoy = el día de hoy del viaje
    function todayRoute() {
      var d = new Date(), y = d.getFullYear(), mo = d.getMonth(), day = d.getDate();
      var start = new Date(2026, 9, 5), today = new Date(y, mo, day);
      var diff = Math.round((start - today) / 86400000);
      if (diff > 0) return { name: 'C-Dia-05', pill: diff === 1 ? 'Mañana empieza el viaje' : 'Faltan ' + diff + ' días' };
      if (y === 2026 && mo === 9 && day >= 5 && day <= 14) return { name: day === 10 ? 'C-Hoy' : 'C-Dia-' + (day < 10 ? '0' : '') + day };
      return { name: 'C-Dia-14' };
    }
    function show(route) {
      var info = route === 'hoy' || !route ? todayRoute() : { name: route };
      var name = SCRIPTS[info.name] ? info.name : 'C-Hoy';
      var s = screens[name] || build(name);
      var prev = current;
      if (current && current !== s) current.host.hidden = true;
      s.host.hidden = false;
      current = s;
      document.getElementById('qc').hidden = name === 'C-Conversor' || !document.getElementById('tk').hidden;
      document.getElementById('hb').hidden = !document.getElementById('tk').hidden;
      if (prev !== s && s.inst.onShow) { try { s.inst.onShow(); } catch (e) {} }
      pill.hidden = !info.pill;
      pill.textContent = info.pill || '';
    }
    function go(route) { if (location.hash.slice(1) === route) show(route); else location.hash = route; }
    window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });

    var tk = document.getElementById('tk');
    document.getElementById('tk-x').addEventListener('click', function () { tk.hidden = true; document.getElementById('hb').hidden = false; document.getElementById('qc').hidden = !!(current && current.host.querySelector('[aria-label^="Cambiar a"]')); });
      document.getElementById('tk-pg').addEventListener('click', function () { this.classList.toggle('zoom'); });
      document.getElementById('qc').addEventListener('click', function () { go('C-Conversor'); });

    app.addEventListener('click', function (e) {
      var el = e.target;
      while (el && el !== app) { if (el.__h) { el.__h(e); break; } el = el.parentNode; }
      var a = e.target.closest ? e.target.closest('a') : null;
      if (!a || !app.contains(a)) return;
      var href = a.getAttribute('href') || '';
      var m = /^\/?([\w-]+)\.dc\.html$/.exec(href);
      if (m) {
        e.preventDefault();
        var inNav = a.closest('nav[aria-label="Secciones"]');
        go(m[1] === 'C-Hoy' && inNav ? 'hoy' : m[1]);
        return;
      }
      if (href.indexOf('ticket/') === 0) {
        e.preventDefault();
        var seat = /ktx(\d+)_(\w+)\.(png|jpg)/.exec(href);
        document.getElementById('tk-img').src = ASSETS[href] || '';
        document.getElementById('tk-qr').src = seat ? (ASSETS['tix/qr_ktx' + seat[1] + '_' + seat[2] + '.png'] || '') : '';
        document.getElementById('tk-t').textContent = seat ? 'KTX ' + seat[1] + ' · asiento ' + seat[2] : 'Billete';
        document.getElementById('tk-pg').classList.remove('zoom');
        document.getElementById('tk').hidden = false;
        document.getElementById('qc').hidden = true;
        document.getElementById('hb').hidden = true;
        return;
      }
      if (href.charAt(0) === '#' || href === '') e.preventDefault();
    });


    // ---------- volver al hotel ----------
    (function () {
      var hb = document.getElementById('hb'), hs = document.getElementById('hs'), sh = document.getElementById('hs-sh');
      var CITY = { '#4FD1A5': '서울', '#F2729F': '경주', '#5AB4F0': '부산' };
      function tonight() {
        var d = new Date(); if (d.getHours() < 5) d = new Date(d.getTime() - 5 * 3600000);
        var y = d.getFullYear(), m = d.getMonth(), day = d.getDate(), note = '';
        var idx = 0;
        if (y === 2026 && m === 9) {
          if (day <= 5) { idx = 0; if (day === 5) note = 'Hoy dormís en el avión · el primer hotel'; }
          else if (day <= 9) idx = 0; else if (day <= 11) idx = 1; else if (day === 12) idx = 2; else idx = 3;
          if (day === 14) note = 'Aquí os guardan las maletas';
        } else if (y > 2026 || (y === 2026 && m > 9)) idx = 3;
        return { h: HOTELS[idx], note: note };
      }
      function fill() {
        var t = tonight(), h = t.h;
        hs.style.setProperty('--hc', h.col);
        document.getElementById('hs-img').src = ASSETS[h.img] || '';
        document.getElementById('hs-city').textContent = CITY[h.col] || '';
        document.getElementById('hs-eb').textContent = t.note || ('Esta noche · ' + h.dates);
        document.getElementById('hs-name').textContent = h.name;
        document.getElementById('hs-kn').textContent = h.ko;
        document.getElementById('hs-ad').textContent = h.addr;
        document.getElementById('hs-naver').href = 'nmap://route/public?dlat=' + h.lat + '&dlng=' + h.lng + '&dname=' + encodeURIComponent(h.ko) + '&appname=corea.bolsillo';
        document.getElementById('hs-kakao').href = 'https://map.kakao.com/link/to/' + h.kakao;
        var tel = document.getElementById('hs-tel');
        tel.hidden = !h.tel; tel.href = 'tel:' + (h.tel || '').replace(/-/g, '');
        var cp = document.getElementById('hs-cp'); cp.textContent = 'Copiar dirección'; cp.classList.remove('ok');
      }
      function open() {
        fill(); hs.hidden = false; sh.scrollTop = 0;
        hb.classList.remove('pop'); void hb.offsetWidth; hb.classList.add('pop');
        requestAnimationFrame(function () { requestAnimationFrame(function () { hs.classList.add('open'); }); });
      }
      function close() {
        hs.classList.remove('open'); sh.style.transform = '';
        setTimeout(function () { if (!hs.classList.contains('open')) hs.hidden = true; }, 480);
      }
      hb.addEventListener('click', open);
      document.getElementById('hs-bd').addEventListener('click', close);
      document.getElementById('hs-cp').addEventListener('click', function () {
        var btn = this, txt = document.getElementById('hs-ad').textContent;
        function ok() { btn.textContent = 'Copiada ✓'; btn.classList.add('ok'); }
        try { navigator.clipboard.writeText(txt).then(ok, function () { selectAd(); }); } catch (e) { selectAd(); }
        function selectAd() { var r = document.createRange(); r.selectNodeContents(document.getElementById('hs-ad')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Seleccionada: pulsa copiar'; }
      });
      var y0 = null, dy = 0;
      sh.addEventListener('touchstart', function (e) { if (sh.scrollTop > 0) return; y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
      sh.addEventListener('touchmove', function (e) {
        if (y0 == null) return; dy = e.touches[0].clientY - y0;
        if (dy > 0) { hs.classList.add('drag'); sh.style.transform = 'translate(-50%,' + dy + 'px)'; }
      }, { passive: true });
      sh.addEventListener('touchend', function () {
        if (y0 == null) return; hs.classList.remove('drag'); y0 = null;
        if (dy > 90) close(); else sh.style.transform = '';
      });
      window.__hotelBtn = hb;
    })();
    show(location.hash.slice(1) || 'hoy');
  }
})();
</script>
</body>
</html>
