<style>
:root{color-scheme:dark}
html,body{height:100%;margin:0;background:#111111;color:#FFFFFF}
body{overflow:hidden;font-family:'Archivo','Helvetica Neue',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
a{color:inherit}

#hs .go:active,#hs .row a:active,#hs .cp:active{transform:scale(.97)}

#hs .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:8px}

#hs .tx{margin-top:14px;padding:16px;border-radius:6px;background:#FFFFFF;color:#111111}

#hs .tx .pl{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:16px}
#hs .cp{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;margin-top:12px;border:0;border-radius:6px;background:#111111;color:#FFFFFF;font:inherit;font-size:14px;font-weight:900;text-transform:uppercase;cursor:pointer;transition:background-color 200ms ease}
#hs .cp.ok{background:var(--hc);color:#111111}
#lock{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;background:#F2729F;color:#111111}

#lock .ko{position:absolute;top:-40px;right:-60px;font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:300px;line-height:1;letter-spacing:-.04em;color:#111111}
#lock h1{margin:0;font-size:52px;line-height:.9;font-weight:900;font-stretch:125%;letter-spacing:-.02em;text-transform:uppercase}
#lock p{margin:0;font-size:16px;font-weight:700;line-height:1.35}
#lock label{font-size:13px;font-weight:900;font-stretch:125%;text-transform:uppercase}
#lock input{height:56px;box-sizing:border-box;padding:0 16px;border:3px solid #111111;border-radius:4px;background:#FFFFFF;color:#111111;font:inherit;font-size:20px;font-weight:800}
#lock button{height:56px;border:0;border-radius:4px;background:#111111;color:#F2729F;font:inherit;font-size:17px;font-weight:900;font-stretch:125%;text-transform:uppercase;cursor:pointer}
#lock .err{min-height:22px;font-size:15px;font-weight:900}
#dv{position:fixed;inset:0;z-index:52;display:flex;flex-direction:column;background:#111111;transform:translateY(100%);transition:transform 440ms cubic-bezier(.32,.72,0,1)}
#dv.open{transform:none}
#dv header{display:flex;align-items:center;gap:12px;padding:max(10px,env(safe-area-inset-top,0px)) 12px 10px 16px}
#dv .tt{flex:1;min-width:0}
#dv h2{margin:0;font-size:16px;font-weight:900;font-stretch:110%;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dv .sb{margin:2px 0 0;font-size:12px;font-weight:700;color:#BDBDBD;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dv .x{flex-shrink:0;min-width:44px;min-height:44px;border:0;border-radius:50%;background:#262626;color:#FFFFFF;font:inherit;font-size:22px;font-weight:900;cursor:pointer}
#dv .pg{flex:1;overflow:auto;padding:4px 12px 16px;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}

#dv .hint{margin:4px 0 0;color:#8A8A8A;font-size:11px;font-weight:800;text-align:center;text-transform:uppercase;letter-spacing:.04em}

#dv #dv-sh:disabled{opacity:.4}
#dv #dv-zm{width:52px;flex-shrink:0;border:2px solid #3A3A3A;background:transparent;color:#FFFFFF}
#dv .ft button:active{transform:scale(.97)}
#tk-pdf{margin-left:auto;min-width:0!important;padding:0 14px;border-radius:22px!important;font-size:13px!important;letter-spacing:.03em;text-transform:uppercase}
#pe{position:fixed;inset:0;z-index:53;display:flex;flex-direction:column;background:#111111;color:#FFFFFF;transform:translateY(100%);transition:transform 440ms cubic-bezier(.32,.72,0,1)}
#pe.open{transform:none}
#pe header{display:flex;align-items:center;gap:12px;padding:max(10px,env(safe-area-inset-top,0px)) 12px 10px 16px;border-bottom:3px solid var(--pc,#FFFFFF)}
#pe .tt{flex:1;min-width:0}
#pe h2{margin:0;font-size:22px;font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:1}
#pe .sb{margin:4px 0 0;font-size:12px;font-weight:800;color:var(--pc,#BDBDBD);text-transform:uppercase;letter-spacing:.03em}
#pe .x{flex-shrink:0;min-width:44px;min-height:44px;border:0;border-radius:50%;background:#262626;color:#FFFFFF;font:inherit;font-size:22px;font-weight:900;cursor:pointer}
#pe-bd{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 12px calc(28px + env(safe-area-inset-bottom,0px))}
#pe button{font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
#pe button:active{transform:scale(.96)}
#pe .lead{margin:0 4px 14px;color:#BDBDBD;font-size:14px;font-weight:600;line-height:1.4}
#pe ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
#pe .pr{display:grid;grid-template-columns:52px minmax(0,1fr) 44px;gap:12px;align-items:center;padding:10px;border-radius:6px;background:#1E1E1E;animation:pe-in 420ms cubic-bezier(.32,.72,0,1) both}
@keyframes pe-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#pe .th{width:52px;height:52px;border-radius:4px;overflow:hidden;background:var(--pc,#333);display:flex;align-items:center;justify-content:center;color:#111111}
#pe .th img{width:100%;height:100%;object-fit:cover;display:block}
#pe .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
#pe .tx b{font-size:16px;font-weight:900;font-stretch:110%;line-height:1.15}
#pe .tx span{font-size:12px;font-weight:700;color:#BDBDBD;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pe .ac{display:flex;gap:6px;margin-top:6px}
#pe .ac button{height:32px;padding:0 12px;border:2px solid #3A3A3A;border-radius:16px;background:transparent;color:#FFFFFF;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
#pe .ac .del{color:#FF6B5B}
#pe .ud{display:flex;flex-direction:column;gap:6px}

#pe .ud button:disabled{opacity:.25}
#pe .mv{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
#pe .mv p{width:100%;margin:0 0 2px;font-size:12px;font-weight:900;text-transform:uppercase;color:#BDBDBD}
#pe .chip{height:40px;padding:0 12px;border:2px solid var(--c);border-radius:4px;background:transparent;color:#FFFFFF;font-size:13px;font-weight:900;font-stretch:110%;text-transform:uppercase}
#pe .empty{margin:6px 4px 14px;padding:18px;border:2px dashed #3A3A3A;border-radius:6px;color:#BDBDBD;font-size:15px;font-weight:700;text-align:center}
#pe .big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;margin-top:14px;border:0;border-radius:4px;background:var(--pc,#FFFFFF);color:#111111;font-size:15px;font-weight:900;font-stretch:125%;text-transform:uppercase}
#pe .sec{display:flex;flex-direction:column;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid #2A2A2A}

#pe .ln{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;padding:6px 14px;border:2px solid #3A3A3A;border-radius:4px;background:transparent;color:#FFFFFF;font-size:14px;font-weight:900;text-transform:uppercase;text-align:left}
#pe .ln small{display:block;margin-top:2px;font-size:11px;font-weight:700;color:#BDBDBD;text-transform:none}
#pe .back{display:flex;align-items:center;gap:6px;min-height:40px;margin:-4px 0 8px;padding:0 4px;border:0;background:transparent;color:#BDBDBD;font-size:13px;font-weight:900;text-transform:uppercase}

#pe .seg button[aria-pressed="true"]{background:#FFFFFF;color:#111111}
#pe input,#pe textarea{width:100%;box-sizing:border-box;min-height:50px;padding:12px 14px;border:2px solid #3A3A3A;border-radius:4px;background:#1A1A1A;color:#FFFFFF;font:inherit;font-size:16px;font-weight:700}
#pe input:focus,#pe textarea:focus{outline:none;border-color:var(--pc,#FFFFFF)}
#pe textarea{min-height:110px;resize:vertical}
#pe label{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:12px;font-weight:900;text-transform:uppercase;color:#BDBDBD}

#pe .cr{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border-radius:6px;background:#1E1E1E}
#pe .cr .ad{height:38px;padding:0 14px;border:0;border-radius:19px;background:var(--pc,#FFFFFF);color:#111111;font-size:12px;font-weight:900;text-transform:uppercase}
#pe .cr .ad:disabled{background:#2C2C2C;color:#8A8A8A}
#pe .res{display:flex;flex-direction:column;gap:6px;margin-top:10px}
#pe .nv{display:inline-flex;align-items:center;gap:6px;margin:-4px 0 14px;color:var(--pc,#FFFFFF);font-size:13px;font-weight:900;text-transform:uppercase;text-decoration:none}
#pe .note{margin:0 4px 12px;color:#BDBDBD;font-size:14px;font-weight:600;line-height:1.4}
#pe .warn{margin:0 0 10px;padding:14px;border-radius:6px;background:#1E1E1E;font-size:15px;font-weight:700;line-height:1.4}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:58;display:flex;align-items:center;justify-content:space-between;gap:14px;width:min(calc(100% - 32px),408px);min-height:54px;box-sizing:border-box;padding:10px 10px 10px 16px;border-radius:8px;background:#FFFFFF;color:#111111;font-size:14px;font-weight:800;box-shadow:0 12px 30px -10px rgba(0,0,0,.7);transform:translate(-50%,20px);opacity:0;transition:transform 380ms cubic-bezier(.32,.72,0,1),opacity 260ms ease;pointer-events:none}

#toast span{flex:1;min-width:0;line-height:1.3}
#toast button{flex-shrink:0;height:34px;padding:0 12px;border:0;border-radius:4px;background:#111111;color:#FFFFFF;font:inherit;font-size:12px;font-weight:900;text-transform:uppercase}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111111;color:#BDBDBD;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
<style id="screen-css"></style>

<div id="boot">Abriendo…</div>
<div id="app"></div>
<div id="pill" hidden></div>
<button type="button" id="hb" aria-label="Volver al hotel" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5.5 9.5V20h13V9.5"></path><path d="M10 20v-5h4v5"></path></svg></button>

    <div class="row st"><a id="hs-kakao" href="#" target="_blank" rel="noopener">Kakao Map</a><a id="hs-tel" href="#">Llamar</a></div>
    <div class="tx st"><div class="lb">Para el taxi · enséñale esto</div><div class="ad" id="hs-ad" lang="ko"></div><div class="pl" lang="ko">이 주소로 가 주세요</div><button type="button" class="cp" id="hs-cp">Copiar dirección</button></div>
  </div>
</div>
<button type="button" id="qc" aria-label="Abrir la calculadora de wones" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><rect x="5" y="3" width="14" height="18"></rect><path d="M8 7h8"></path><path d="M8 11.5h.5M11.75 11.5h.5M15.5 11.5h.5M8 15h.5M11.75 15h.5M15.5 15h.5M8 18.5h.5M11.75 18.5h.5M15.5 18.5h.5"></path></svg></button>

  <header><h2 id="tk-t">Billete</h2><button type="button" id="tk-pdf" hidden>PDF original</button><button type="button" id="tk-x" aria-label="Cerrar billete">×</button></header>
  <div class="pg" id="tk-pg"><div id="tk-box"><img id="tk-img" alt="Billete del KTX" style="display:block;width:100%;height:auto;border-radius:4px;background:#FFFFFF"><img id="tk-qr" alt="Código QR del billete"></div><p class="hint">Toca el billete para ampliarlo</p></div>

<script>

var ITER = 600000;

(function () {
  var KEY_STORE = 'corea.key.' + SALT_B64.slice(0, 8);
  function b64(buf) { var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }

  }

  var lock = document.getElementById('lock'), boot = document.getElementById('boot');
  function askPassword(msg) {
    boot.hidden = true;

  }
  document.getElementById('lock-f').addEventListener('submit', function (e) {
    e.preventDefault();

    var rawKey;
    deriveKey(pw).then(function (raw) { rawKey = raw; return decrypt(raw); }).then(function (payload) {
      store(KEY_STORE, b64(rawKey));

      lock.hidden = true;
      start(payload);
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = 'Entrar';
      if (err && /app\.bin|Failed to fetch|NetworkError|Load failed/i.test(String(err.message || err))) {

      } else {
        askPassword('Contraseña incorrecta.');
      }

  var saved = load(KEY_STORE);

    decrypt(unb64(saved)).then(function (p) { RAWKEY = unb64(saved); start(p); }).catch(function (err) {
      if (err && /app\.bin|Failed to fetch|NetworkError|Load failed/i.test(String(err.message || err))) {

    });

    askPassword('');
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  // ---------- motor de pantallas ----------
  function start(payload) {
    document.getElementById('screen-css').textContent = payload.css;
    document.getElementById('tpls').innerHTML = payload.templates;
    var mod = new Function(payload.scripts + '\nreturn { SCRIPTS: SCRIPTS, ASSETS: ASSETS, HOTELS: HOTELS, DOCS: (typeof DOCS !== "undefined" ? DOCS : []), PLANDATA: (typeof PLANDATA !== "undefined" ? PLANDATA : null) };')();
    var SCRIPTS = mod.SCRIPTS, ASSETS = mod.ASSETS, HOTELS = mod.HOTELS, DOCS = mod.DOCS;
    boot.hidden = true;

    var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
    var ONLY = /^\{\{\s*([^}]+?)\s*\}\}$/;
    function lookup(path, scope) {
      if (path === 'true') return true;
      if (path === 'false') return false;
      if (path === 'null') return null;
      if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
      var parts = path.split('.'), v = scope;
      for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
      return v;
    }
    function interp(str, scope) { return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); }); }
    function child(scope, name, val, idx) { var s = Object.create(scope); s[name] = val; s.$index = idx; return s; }

      if (node.nodeType !== 1) return;

      if (tag === 'sc-for') {
        var list = lookup(ONLY.exec(node.getAttribute('list'))[1], scope) || [];
        var as = node.getAttribute('as') || 'item';
        for (var i = 0; i < list.length; i++) { var sc = child(scope, as, list[i], i); node.childNodes.forEach(function (c) { render(c, sc, out); }); }
        return;
      }
      if (tag === 'sc-if') {
        if (lookup(ONLY.exec(node.getAttribute('value'))[1], scope)) node.childNodes.forEach(function (c) { render(c, scope, out); });
        return;
      }
      var el = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(node.namespaceURI, tag) : document.createElement(tag);
      for (var a = 0; a < node.attributes.length; a++) {
        var at = node.attributes[a], name = at.name, val = at.value;
        if (name.indexOf('hint-') === 0) continue;
        var m = ONLY.exec(val);
        if (name === 'onclick') { el.__h = m ? lookup(m[1], scope) : null; continue; }
        var v = m ? lookup(m[1], scope) : interp(val, scope);
        if (v == null || v === false) continue;
        v = String(v);
        if (v.indexOf('asset:') === 0) v = ASSETS[v.slice(6)] || '';
        el.setAttribute(name, v);
      }
      if (tag === 'a') {
        var href = el.getAttribute('href') || '';
        if (/^https?:/.test(href)) { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener'); }
      }
      var co = [];
      node.childNodes.forEach(function (c) { render(c, scope, co); });
      co.forEach(function (c) { el.appendChild(c); });
      out.push(el);
    }
    function morph(a, b) {
      if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
      if (a.nodeType === 3) { if (a.data !== b.data) a.data = b.data; return; }
      var i, n;
      for (i = a.attributes.length - 1; i >= 0; i--) { n = a.attributes[i].name; if (!b.hasAttribute(n)) a.removeAttribute(n); }
      for (i = 0; i < b.attributes.length; i++) { n = b.attributes[i]; if (a.getAttribute(n.name) !== n.value) a.setAttribute(n.name, n.value); }
      a.__h = b.__h;
      morphKids(a, b);
    }
    function morphKids(a, b) {
      var ak = Array.prototype.slice.call(a.childNodes), bk = Array.prototype.slice.call(b.childNodes);
      for (var i = 0; i < bk.length; i++) { if (i < ak.length) morph(ak[i], bk[i]); else a.appendChild(bk[i]); }
      for (var j = bk.length; j < ak.length; j++) ak[j].remove();
    }

    function DCLogic(props) { this.props = props || {}; this.state = {}; }
    DCLogic.prototype.setState = function (o) {
      var p = typeof o === 'function' ? o(this.state, this.props) : o;
      this.state = Object.assign({}, this.state, p);
      if (this.__render) this.__render();
    };
    DCLogic.prototype.forceUpdate = function () { if (this.__render) this.__render(); };

    var app = document.getElementById('app'), pill = document.getElementById('pill');
    var screens = {}, current = null;
    function build(name) {
      var tpl = document.getElementById('t-' + name);
      var inst = new (SCRIPTS[name](DCLogic))({});
      var host = document.createElement('div');
      host.className = 'scr'; host.hidden = true;
      app.appendChild(host);
      inst.__render = function () {
        var vals = inst.renderVals ? inst.renderVals() : {};
        var out = [];
        tpl.content.childNodes.forEach(function (c) { render(c, vals, out); });
        var tmp = document.createElement('div');
        out.forEach(function (c) { tmp.appendChild(c); });
        morphKids(host, tmp);
      };
      inst.__render();
      if (inst.componentDidMount) { try { inst.componentDidMount(); } catch (e) {} }
      return (screens[name] = { host: host, inst: inst });
    }

    // Hoy = el día de hoy del viaje
    function todayRoute() {
      var d = new Date(), y = d.getFullYear(), mo = d.getMonth(), day = d.getDate();
      var start = new Date(2026, 9, 5), today = new Date(y, mo, day);
      var diff = Math.round((start - today) / 86400000);
      if (diff > 0) return { name: 'C-Dia-05', pill: diff === 1 ? 'Mañana empieza el viaje' : 'Faltan ' + diff + ' días' };
      if (y === 2026 && mo === 9 && day >= 5 && day <= 14) return { name: day === 10 ? 'C-Hoy' : 'C-Dia-' + (day < 10 ? '0' : '') + day };
      return { name: 'C-Dia-14' };
    }
    function show(route) {
      var info = route === 'hoy' || !route ? todayRoute() : { name: route };
      var name = SCRIPTS[info.name] ? info.name : 'C-Hoy';
      var s = screens[name] || build(name);
      var prev = current;
      if (current && current !== s) current.host.hidden = true;
      s.host.hidden = false;
      current = s;
      document.getElementById('qc').hidden = name === 'C-Conversor' || !document.getElementById('tk').hidden;
      document.getElementById('hb').hidden = !document.getElementById('tk').hidden;
      if (prev !== s && s.inst.onShow) { try { s.inst.onShow(); } catch (e) {} }
      if (name === 'C-Docs') docsStatus();
      pill.hidden = !info.pill;
      pill.textContent = info.pill || '';
    }
    function go(route) { if (location.hash.slice(1) === route) show(route); else location.hash = route; }
    window.addEventListener('hashchange', function () { var hh = location.hash.slice(1); if (/^plan=/.test(hh)) { try { history.replaceState(null, '', location.pathname + location.search + '#hoy'); } catch (e) {} openImport(hh.slice(5)); return; } show(hh); });

    var tk = document.getElementById('tk');
    document.getElementById('tk-x').addEventListener('click', function () { tk.hidden = true; document.getElementById('hb').hidden = false; document.getElementById('qc').hidden = !!(current && current.host.querySelector('[aria-label^="Cambiar a"]')); });
      document.getElementById('tk-pg').addEventListener('click', function () { this.classList.toggle('zoom'); });
      document.getElementById('qc').addEventListener('click', function () { go('C-Conversor'); });
      document.getElementById('tk-pdf').addEventListener('click', function () { openDoc(this.getAttribute('data-doc')); });

    // ---------- planes editables (se guardan en este móvil; se comparten por enlace) ----------
    var PD = mod.PLANDATA || { catalog: {}, defaults: {}, days: [] };
    var CAT = PD.catalog, PDEF = PD.defaults, PDAYS = PD.days;
    var PKEY = 'corea.plans.v1';
    function pload() {
      try { var o = JSON.parse(localStorage.getItem(PKEY) || 'null'); if (o && o.v === 1 && o.days && o.custom) return o; } catch (e) {}
      return { v: 1, days: {}, custom: {} };
    }
    var PS = pload();
    PS.base = PS.base || {};
    // Si Claude cambia los planes de un día en la app y aquí tenías tu versión: aviso para elegir
    var PUPD = {};
    Object.keys(PS.days).forEach(function (n) {
      var def = PDEF[n] || [];
      if (sameList(PS.days[n], def)) { delete PS.days[n]; delete PS.base[n]; return; }
      if (PS.base[n] != null && PS.base[n] !== def.join(',')) PUPD[n] = 1;
    });
    function psave() {
      PS.ts = Date.now();
      try { localStorage.setItem(PKEY, JSON.stringify(PS)); } catch (e) {}
    }
    function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function naverQ(q) { return 'https://map.naver.com/p/search/' + encodeURIComponent(q); }
    function kakaoQ(q) { return 'https://map.kakao.com/?q=' + encodeURIComponent(q); }
    function customPlan(id, c) {
      var q = (c.a || c.t || '').trim();
      return { id: id, t: c.t, ko: /[가-힣]/.test(c.a || '') ? c.a : '', tag: c.tag || 'Añadido', img: '', d: c.d || '', cr: '', nv: naverQ(q), kk: kakaoQ(q), cp: q, custom: true };
    }
    function planById(id) {
      if (CAT[id]) return CAT[id];
      if (PS.custom[id]) return customPlan(id, PS.custom[id]);
      return null;
    }
    function dayIds(n) { n = String(n); return (PS.days[n] || PDEF[n] || []).slice(); }
    function sameList(a, b) { return a.length === b.length && a.every(function (x, i) { return x === b[i]; }); }
    function setDay(n, ids) {
      n = String(n);
      if (sameList(ids, PDEF[n] || [])) { delete PS.days[n]; delete PS.base[n]; } else { PS.days[n] = ids; PS.base[n] = (PDEF[n] || []).join(','); }
      delete PUPD[n];
      psave(); prefresh();
    }
    function dayInfo(n) { for (var i = 0; i < PDAYS.length; i++) if (String(PDAYS[i].n) === String(n)) return PDAYS[i]; return { n: n, dw: '', col: '#FFFFFF', city: '' }; }
    function dayRoute(n) { return String(n) === '10' ? 'C-Hoy' : 'C-Dia-' + (n < 10 ? '0' : '') + n; }
    window.PLANS = {
      forDay: function (n, def) {
        n = String(n);
        if (!PS.days[n]) return def;
        return PS.days[n].map(planById).filter(Boolean);
      },
      isEdited: function (n) { return !!PS.days[String(n)]; },
      hasUpdate: function (n) { return !!PUPD[String(n)]; },
      resolve: function (n, useNew) {
        n = String(n);
        if (useNew) { delete PS.days[n]; delete PS.base[n]; } else PS.base[n] = (PDEF[n] || []).join(',');
        delete PUPD[n]; psave(); prefresh();
        say(useNew ? 'Ahora tienes los planes nuevos' : 'Te quedas con tu versión');
      },
      summary: function (n) {
        var t = dayIds(n).map(planById).filter(Boolean).map(function (p) { return p.t; });
        if (!t.length) return ['Sin planes'];
        return t.length > 3 ? t.slice(0, 2).concat(['y ' + (t.length - 2) + ' sitios más']) : t;
      }
    };
    function prefresh() {
      Object.keys(screens).forEach(function (k) { try { screens[k].inst.forceUpdate(); } catch (e) {} });
      if (!pe.hidden) peRender();
    }
    function imgSrc(p) { return p && p.img ? (p.img.indexOf('asset:') === 0 ? ASSETS[p.img.slice(6)] || '' : p.img) : ''; }
    var PIN_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>';
    function thumb(p) { var src = imgSrc(p); return '<div class="th">' + (src ? '<img alt="" src="' + esc(src) + '">' : PIN_SVG) + '</div>'; }

    // --- aviso con deshacer ---
    var toast = document.getElementById('toast'), toastT = document.getElementById('toast-t'), toastU = document.getElementById('toast-u'), toastTimer = null, toastUndo = null;
    function say(msg, undo) {
      toastT.textContent = msg; toastUndo = undo || null; toastU.hidden = !undo;
      toast.classList.add('on'); clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('on'); toastUndo = null; }, undo ? 5000 : 2600);
    }
    toastU.addEventListener('click', function () { var u = toastUndo; toast.classList.remove('on'); toastUndo = null; if (u) u(); });

    // --- editor ---
    var pe = document.getElementById('pe'), peBd = document.getElementById('pe-bd');
    var peDay = null, peView = 'list', peMoving = -1, peTab = 'cat', peQuery = '', pePushed = false, peImport = null;
    function openEditor(n, view) {
      peDay = String(n); peView = view || 'list'; peMoving = -1; peTab = 'cat'; peQuery = '';
      var di = dayInfo(peDay);
      pe.style.setProperty('--pc', di.col);
      document.getElementById('pe-t').textContent = di.dw + ' ' + di.n + ' oct';
      document.getElementById('pe-s').textContent = 'Editar planes';
      peRender();
      if (pe.hidden) {
        pe.hidden = false;
        try { history.pushState({ pe: 1 }, ''); pePushed = true; } catch (e) { pePushed = false; }
        requestAnimationFrame(function () { requestAnimationFrame(function () { pe.classList.add('open'); }); });
      }
      peBd.scrollTop = 0;
    }
    function closeEditor() {
      pe.classList.remove('open'); peImport = null;
      setTimeout(function () { if (!pe.classList.contains('open')) pe.hidden = true; }, 460);
    }
    document.getElementById('pe-x').addEventListener('click', function () { if (pePushed) { pePushed = false; history.back(); } else closeEditor(); });
    window.addEventListener('popstate', function () { if (!pe.hidden && pe.classList.contains('open') && dv.hidden) { pePushed = false; closeEditor(); } });

    function peRender() {
      if (peView === 'add') return peRenderAdd();
      if (peView === 'recv') return peRenderRecv();
      if (peView === 'confirm') return peRenderConfirm();
      var ids = dayIds(peDay), h = '';
      h += '<p class="lead">Ordena, quita o mueve los sitios de este día. Se guarda en este móvil; para que lo vean las demás, usa «Enviar mis cambios».</p>';
      if (!ids.length) h += '<p class="empty">Este día no tiene planes todavía.</p>';
      else {
        h += '<ol>';
        ids.forEach(function (id, i) {
          var p = planById(id); if (!p) return;
          var sub = [p.tag, p.ko].filter(Boolean).join(' · ');
          h += '<li class="pr" data-i="' + i + '">' + thumb(p) +
            '<div class="tx"><b>' + esc(p.t) + '</b><span>' + esc(sub) + '</span>' +
            '<div class="ac"><button type="button" data-a="move">Mover</button><button type="button" class="del" data-a="del">Quitar</button></div></div>' +
            '<div class="ud"><button type="button" data-a="up" aria-label="Subir"' + (i === 0 ? ' disabled' : '') + '><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="square" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg></button>' +
            '<button type="button" data-a="down" aria-label="Bajar"' + (i === ids.length - 1 ? ' disabled' : '') + '><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="square" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></div>';
          if (peMoving === i) {
            h += '<div class="mv"><p>Mover a otro día</p>' + PDAYS.filter(function (d) { return String(d.n) !== peDay; }).map(function (d) {
              return '<button type="button" class="chip" style="--c:' + d.col + '" data-a="to" data-n="' + d.n + '">' + esc(d.dw) + ' ' + d.n + '</button>';
            }).join('') + '</div>';
          }
          h += '</li>';
        });
        h += '</ol>';
      }
      h += '<button type="button" class="big" data-a="add"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Añadir un sitio</button>';
      h += '<div class="sec"><h3>Compartir</h3>' +
        '<button type="button" class="ln" data-a="send"><span>Enviar mis cambios<small>Un enlace para mandarlo por WhatsApp</small></span>›</button>' +
        '<button type="button" class="ln" data-a="recv"><span>Recibir cambios<small>Pega el mensaje que te han mandado</small></span>›</button>';
      if (window.PLANS.isEdited(peDay)) h += '<button type="button" class="ln" data-a="reset"><span>Volver a los planes originales<small>Solo de este día</small></span>›</button>';
      h += '</div>';
      peBd.innerHTML = h;
    }
    function peRenderAdd() {
      var di = dayInfo(peDay), h = '<button type="button" class="back" data-a="list">‹ Volver</button>';
      h += '<div class="seg" role="group" aria-label="Cómo añadir"><button type="button" data-a="tab" data-t="cat" aria-pressed="' + (peTab === 'cat') + '">De la lista</button><button type="button" data-a="tab" data-t="new" aria-pressed="' + (peTab === 'new') + '">Sitio nuevo</button></div>';
